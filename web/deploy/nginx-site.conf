# nginx vhost for the new site + the app, on 143.42.46.116.
# Install as /etc/nginx/sites-available/urbanprospects.conf (symlink into
# sites-enabled), fill in the TLS lines, then `nginx -t && systemctl reload nginx`.
#
#   /            → SvelteKit Node server (systemd unit: deploy/upweb.service, port 3000).
#                  Prerendered marketing pages are served by that same process from
#                  build/prerendered; only /login, /account, /auth/* etc. hit code.
#   /app/        → static upapp build (/opt/www/upapp), gated by auth_request.
#   /q/          → the app's API (Express, api.js). WordPress used to proxy this at
#                  https://www.urbanprospects.com.au/q; keep the same path here so
#                  upapp's api_domain does not change. Point upstream at wherever
#                  api.js listens after the move.
#
# Also see deploy/redirects.conf (301s for moved WordPress URLs).

upstream upweb { server 127.0.0.1:3000; keepalive 16; }
# upstream upapi { server 127.0.0.1:3001; }   # api.js — set the real address

server {
    listen 80;
    listen [::]:80;
    server_name urbanprospects.com.au www.urbanprospects.com.au preview.urbanprospects.com.au;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://www.urbanprospects.com.au$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.urbanprospects.com.au preview.urbanprospects.com.au;

    # ssl_certificate     /etc/letsencrypt/live/www.urbanprospects.com.au/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.urbanprospects.com.au/privkey.pem;

    include /opt/www/upweb-redirects.conf;

    # --- auth gate used by /app/ ---------------------------------------------
    location = /auth/check {
        internal;
        proxy_pass http://upweb/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    # --- the app (static build, BASE_PATH=/app) ------------------------------
    location /app/ {
        auth_request /auth/check;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login;

        alias /opt/www/upapp/;
        index index.html;
        try_files $uri $uri/ $uri.html /app/index.html;
        add_header Cache-Control "no-store" always;
    }
    location = /app { return 301 /app/; }

    location @login {
        return 302 /login/?next=$request_uri;
    }

    # --- app API (was proxied by WordPress at /q) ------------------------------
    # location /q/ {
    #     auth_request /auth/check;
    #     proxy_pass http://upapi/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 120s;
    # }

    # --- everything else: SvelteKit ---------------------------------------------
    location / {
        proxy_pass http://upweb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
