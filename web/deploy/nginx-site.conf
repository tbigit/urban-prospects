# nginx vhost for the new site + the app, on 143.42.46.116.
# Install as /etc/nginx/sites-available/urbanprospects.conf (symlink into
# sites-enabled), fill in the TLS lines, then `nginx -t && systemctl reload nginx`.
#
#   /            → SvelteKit Node server (systemd unit: deploy/upweb.service, port 3000).
#                  Prerendered marketing pages are served by that same process from
#                  build/prerendered; only /login, /account, /auth/* etc. hit code.
#   /app/        → the property app, merged into the SvelteKit build (node).
#   /q/          → the app's API (Express, api.js on the Urban API host). WordPress
#                  proxied this through /var/www/html/q/api.php (PHP, session_start,
#                  no curl timeout); nginx goes straight to the API instead. The
#                  live/standby *database* swap lives inside api.js (touch its
#                  `standby` file, or POST /standby/on), so no proxy is needed for it.
#   /p/          → the GIS/map server (Martin-style tile API). WordPress proxied this
#                  through /var/www/html/p/gis.php (primary) and /p2/gis.php
#                  (standby). Here one upstream carries both: nginx fails over to
#                  the `backup` server when the primary is down.
#
# Also see deploy/redirects.conf (301s for moved WordPress URLs).

upstream upweb { server 127.0.0.1:3000; keepalive 16; }
# api.js. Express listens on :3000 on the API host; the TLS name in front of it
# is upapi.imtg.com.au (ServerPilot nginx). Use the TLS name so nothing plain-text
# crosses the public network.
upstream upapi { server upapi.imtg.com.au:443; keepalive 8; }
# GIS/map server, primary + standby (replaces the /p and /p2 PHP proxies).
upstream upgis {
    server 172.105.184.178:3000 max_fails=2 fail_timeout=30s;
    server 172.105.174.70:3000 backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name urbanprospects.com.au www.urbanprospects.com.au preview.urbanprospects.com.au;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://www.urbanprospects.com.au$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.urbanprospects.com.au preview.urbanprospects.com.au;

    # ssl_certificate     /etc/letsencrypt/live/www.urbanprospects.com.au/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.urbanprospects.com.au/privkey.pem;

    include /opt/www/upweb-redirects.conf;

    # --- the app ---------------------------------------------------------------
    # upapp is merged into the SvelteKit build (web/src/routes/app, 2026-09-06):
    # /app/ is served by the node server like every other route, and the session
    # cookie is checked in src/routes/app/+layout.server.ts. No auth_request, no
    # static alias, /opt/www/upapp is no longer used. /auth/check stays available
    # for anything else that wants a cheap session probe.
    location = /app { return 301 /app/; }

    # --- app API (was proxied by WordPress at /q and /q2) -----------------------
    # No cookies cross to the API (it has no session of its own), so a slow query
    # never serialises the other calls from the same browser the way the PHP
    # session lock did. auth_request is optional: the API itself is public today.
    # v2 routes check the site's session cookie themselves (requireSession in api.js),
    # so this block, and only this block, forwards it. Longest prefix wins over /q/.
    location /q/v2/ {
        proxy_pass https://upapi/v2/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host upapi.imtg.com.au;
        proxy_ssl_server_name on;
        proxy_ssl_name upapi.imtg.com.au;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header Set-Cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
    location /q/ {
        proxy_pass https://upapi/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host upapi.imtg.com.au;
        proxy_ssl_server_name on;
        proxy_ssl_name upapi.imtg.com.au;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
    location /q2/ { rewrite ^/q2/(.*)$ /q/$1 last; }

    # --- GIS/map API (was proxied by WordPress at /p and /p2) -------------------
    location /p/ {
        proxy_pass http://upgis/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location /p2/ { rewrite ^/p2/(.*)$ /p/$1 last; }

    # --- everything else: SvelteKit ---------------------------------------------
    location / {
        proxy_pass http://upweb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
