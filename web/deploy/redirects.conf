# Permanent redirects for URLs that moved in the SvelteKit rebuild.
#
# Include this inside the `server { ... }` block of the nginx vhost that serves
# /opt/www/upweb (that vhost lives on the server, outside this repo):
#
#     include /opt/www/upweb-redirects.conf;
#
# then `nginx -t && systemctl reload nginx`.
#
# The static build also ships build/blog/index.html as a meta-refresh fallback
# (src/routes/blog/+page.ts), but only a server-side 301 passes link equity, so
# this file is the one that matters once the domain moves to this host.

# The article index moved from /blog to /insights. Every article keeps its
# original root-level /<slug>/ path, so nothing else needs redirecting.
location = /blog       { return 301 /insights/; }
location = /blog/      { return 301 /insights/; }
location = /blog/index.html { return 301 /insights/; }

# WordPress pages that moved at the 2026-09-08 cutover. The region landing
# pages (/nsw-regions/, /land-for-sale-*/ etc.) kept their paths, so only the
# renamed one needs a 301. /contact, /faq and /privacy-policy have no
# equivalent on the new site yet — see CLAUDE.md "Known gaps".
location = /about-us  { return 301 /about/; }
location = /about-us/ { return 301 /about/; }
