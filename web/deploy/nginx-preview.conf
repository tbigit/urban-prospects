# preview.urbanprospects.com.au — Urban Prospects site (SvelteKit adapter-node) + app at /app.
# Replaces the earlier static-only vhost. Behind Cloudflare proxy; origin TLS = Cloudflare Origin CA.
#   /        → Node server (systemd: upweb, 127.0.0.1:3010, /opt/www/upweb-node)
#   /app/    → static upapp build in /opt/www/upapp-gated, gated by auth_request → /auth/check
# Install: cp to /etc/nginx/conf.d/preview.urbanprospects.com.au.conf && nginx -t && systemctl reload nginx

upstream upweb { server 127.0.0.1:3010; keepalive 16; }   # 3000 is taken by the app API (/opt/api/api.js)

server {
    listen 80;
    server_name preview.urbanprospects.com.au;
    location ^~ /.well-known/acme-challenge/ { root /opt/www/acme_challenge; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name preview.urbanprospects.com.au;

    ssl_certificate     /opt/www/ssl/preview.urbanprospects.com.au.cer;
    ssl_certificate_key /opt/www/ssl/preview.urbanprospects.com.au.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Real client IP from Cloudflare
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Design preview — keep it out of search results
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- auth gate for /app/ -------------------------------------------------
    location = /auth/check {
        internal;
        proxy_pass http://upweb/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }
    location @login { return 302 /login/?next=$request_uri; }

    # ---- the app (BASE_PATH=/app build) --------------------------------------
    location = /app { return 301 /app/; }
    location /app/ {
        auth_request /auth/check;
        error_page 401 = @login;
        alias /opt/www/upapp-gated/;
        index index.html;
        try_files $uri $uri/ $uri.html /app/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- app API. WordPress proxied www.urbanprospects.com.au/q → api.js; same path here so
    #      upapp's api_domain keeps working. api.js listens on 3000 (see io.conf).
    location /q/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # ---- the site: SvelteKit Node server ---------------------------------------
    location / {
        proxy_pass http://upweb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    access_log /var/log/nginx/preview.urbanprospects.access.log;
    error_log  /var/log/nginx/preview.urbanprospects.error.log;
}
