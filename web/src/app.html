<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/favicon-512.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0710" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Resolve theme before first paint (no flash). Stores preference
			// (system|light|dark); applies the concrete dark/light to <html>.
			try {
				var t = localStorage.getItem('theme') || 'system';
				var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = d ? 'dark' : 'light';
			} catch (e) {}
		</script>
		<noscript
			><style>
				.reveal {
					opacity: 1 !important;
					transform: none !important;
					filter: none !important;
				}
			</style></noscript
		>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
