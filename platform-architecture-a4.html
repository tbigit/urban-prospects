<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Urban Prospects — platform architecture (A4)</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 10mm; }
  html, body { margin: 0; background: #ffffff; }
  body { display: flex; justify-content: center; }
  .page { width: 277mm; }
  svg { display: block; width: 100%; height: auto; }
  @media screen { .page { margin: 24px auto; } }
  @media print { .page { margin: 0; } }
  .name { font-family: 'Geist', 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #2d3142; }
  .sub  { font-family: 'Geist', 'Inter', system-ui, sans-serif; font-size: 16px; fill: #4f5d75; }
  .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 16px; fill: #4f5d75; }
  .plane { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 600; fill: #2d3142; letter-spacing: 0.08em; }
  .lbl { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 16px; fill: #7a8399; }
  .focal .name { fill: #5c2687; }
</style>
</head>
<body>
<div class="page">
<svg viewBox="0 0 1080 708" role="img" aria-labelledby="platform-a4-title platform-a4-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="platform-a4-title">Urban Prospects platform architecture</title>
  <desc id="platform-a4-desc">Two-plane architecture: a weekly Python/Sedona ETL loads PostgreSQL with PostGIS, Martin serves vector tiles through an nginx tile cache; the Express API queries the database and returns results JSON to the SvelteKit frontend, Stripe handles subscriptions via checkout redirect, and users reach the frontend over HTTPS.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Planes -->
  <rect x="16" y="16" width="1048" height="248" rx="8" fill="none" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
  <text class="plane" x="1048" y="44" text-anchor="end">DATA PLANE</text>
  <rect x="16" y="328" width="1048" height="272" rx="8" fill="none" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
  <text class="plane" x="940" y="356" text-anchor="end">APPLICATION PLANE</text>

  <!-- Connectors -->
  <!-- ETL -> PG -->
  <line x1="188" y1="162" x2="316" y2="162" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="192" y="136" width="120" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="252" y="151" text-anchor="middle">loads weekly</text>
  <!-- PG -> Martin -->
  <line x1="516" y1="162" x2="628" y2="162" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="520" y="136" width="104" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="572" y="151" text-anchor="middle">reads geom</text>
  <!-- Martin -> nginx -->
  <line x1="784" y1="162" x2="892" y2="162" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="790" y="136" width="96" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="838" y="151" text-anchor="middle">MVT tiles</text>

  <!-- PG -> Express API -->
  <path d="M416 204 V288 a8 8 0 0 1 -8 8 H150 a8 8 0 0 0 -8 8 V400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="180" y="270" width="200" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="280" y="285" text-anchor="middle">SQL: search, filters</text>

  <!-- nginx -> SvelteKit -->
  <line x1="970" y1="204" x2="970" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="776" y="276" width="186" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="958" y="291" text-anchor="end">GET /p/{z}/{x}/{y}</text>

  <!-- Express -> Stripe -->
  <line x1="252" y1="442" x2="400" y2="442" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="256" y="416" width="140" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="326" y="431" text-anchor="middle">create session</text>
  <!-- Stripe -> SvelteKit -->
  <line x1="596" y1="442" x2="776" y2="442" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="600" y="416" width="172" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="686" y="431" text-anchor="middle">checkout redirect</text>

  <!-- Express -> SvelteKit results JSON -->
  <path d="M142 484 V532 a8 8 0 0 0 8 8 H852 a8 8 0 0 0 8 -8 V484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="440" y="514" width="120" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="500" y="529" text-anchor="middle">results JSON</text>

  <!-- SvelteKit <-> Users -->
  <line x1="956" y1="484" x2="956" y2="632" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="964" y="548" width="60" height="20" rx="2" fill="#ffffff"/>
  <text class="lbl" x="968" y="563">HTTPS</text>

  <!-- Data plane boxes -->
  <rect x="32" y="120" width="156" height="84" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text class="name" x="110" y="156" text-anchor="middle">Python / Sedona</text>
  <text class="sub" x="110" y="180" text-anchor="middle">weekly ETL script</text>

  <g class="focal">
  <rect x="316" y="120" width="200" height="84" rx="6" fill="rgba(92,38,135,0.06)" stroke="#5c2687" stroke-width="1.2"/>
  <text class="name" x="416" y="150" text-anchor="middle">PostgreSQL + PostGIS</text>
  <text class="sub" x="416" y="172" text-anchor="middle">5 million NSW properties</text>
  <text class="sub" x="416" y="192" text-anchor="middle">zoning, overlays, geom</text>
  </g>

  <rect x="628" y="120" width="156" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="706" y="156" text-anchor="middle">Martin</text>
  <text class="sub" x="706" y="180" text-anchor="middle">vector tile server</text>

  <rect x="892" y="120" width="156" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="970" y="156" text-anchor="middle">nginx</text>
  <text class="sub" x="970" y="180" text-anchor="middle">tile cache proxy</text>

  <!-- Application plane boxes -->
  <rect x="32" y="400" width="220" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="142" y="430" text-anchor="middle">Express API</text>
  <text class="sub" x="142" y="452" text-anchor="middle">api.js</text>
  <text class="sub" x="142" y="472" text-anchor="middle">list-view search</text>

  <rect x="400" y="400" width="196" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text class="name" x="498" y="436" text-anchor="middle">Stripe</text>
  <text class="sub" x="498" y="460" text-anchor="middle">subscriptions &amp; billing</text>

  <rect x="776" y="400" width="272" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text class="name" x="912" y="430" text-anchor="middle">SvelteKit</text>
  <text class="sub" x="912" y="452" text-anchor="middle">static frontend</text>
  <text class="sub" x="912" y="472" text-anchor="middle">list + map view</text>

  <!-- Users -->
  <rect x="876" y="632" width="160" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text class="name" x="956" y="664" text-anchor="middle">Users (browser)</text>
</svg>
</div>
</body>
</html>
